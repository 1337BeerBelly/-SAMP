name: Build and package Redline SA

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish Redline SA Windows and Linux packages as public GitHub release downloads
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Compile and package Redline SA
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout open.mp Pawn compiler
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openmultiplayer/compiler
          # openmultiplayer/compiler v3.10.11
          ref: 38e9795439fff218fae5096d43c468acc2e513a1
          path: .tools/pawn-compiler

      - name: Checkout open.mp standard includes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: openmultiplayer/omp-stdlib
          ref: 689c824f6cc558b1ca1b36cfd1aae7f1cda16d65
          path: .tools/omp-stdlib

      - name: Build Pawn compiler
        run: |
          cmake -S .tools/pawn-compiler/source/compiler \
            -B .tools/pawn-compiler/build \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build .tools/pawn-compiler/build --target pawncc --parallel 2

      - name: Compile gamemode
        run: |
          export LD_LIBRARY_PATH="${GITHUB_WORKSPACE}/.tools/pawn-compiler/build${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}"
          PAWNCC="${GITHUB_WORKSPACE}/.tools/pawn-compiler/build/pawncc" \
          OMP_INCLUDE_DIR="${GITHUB_WORKSPACE}/.tools/omp-stdlib" \
          ./scripts/build.sh

      - name: Upload source and compiled gamemode
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redline-sa-source-${{ github.sha }}
          path: |
            gamemodes/dm_tdm.pwn
            gamemodes/dm_tdm.amx
          if-no-files-found: error
          retention-days: 30

      - name: Assemble minimal Windows and Linux server folders
        env:
          OPENMP_VERSION: v1.5.8.3079
        run: ./scripts/package-server.sh

      - name: Upload complete Windows server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redline-sa-server-windows-${{ github.sha }}
          path: dist/windows
          if-no-files-found: error
          retention-days: 30

      - name: Upload complete Linux server
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redline-sa-server-linux-${{ github.sha }}
          path: dist/linux
          if-no-files-found: error
          retention-days: 30

      - name: Upload archives for public release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: redline-sa-release-assets-${{ github.sha }}
          path: |
            dist/release/redline-sa-windows.zip
            dist/release/redline-sa-linux.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish Redline SA download links
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.publish_release == 'true') ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-release]'))
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: redline-sa-release-assets-${{ github.sha }}
          path: release-assets

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_TAG="redline-sa-${GITHUB_SHA:0:12}"
          RELEASE_TITLE="Redline SA (${GITHUB_SHA:0:7})"
          RELEASE_NOTES="Redline SA is a minimal open.mp DM/TDM server package with our .pwn/.amx gamemode, config.json, and official runtime components. No third-party plugins are needed."

          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" \
              release-assets/redline-sa-windows.zip \
              release-assets/redline-sa-linux.tar.gz \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" \
              release-assets/redline-sa-windows.zip \
              release-assets/redline-sa-linux.tar.gz \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${RELEASE_TITLE}" \
              --notes "${RELEASE_NOTES}" \
              --prerelease \
              --target "${GITHUB_SHA}"
          fi

          echo "Public release: https://github.com/${GITHUB_REPOSITORY}/releases/tag/${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
